name: "[condo] Build & push Docker image"

on:
  push:
    branches:
      - main
      - feature/mn-locale-base
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # `next build` stops at the first type error; this lists all of them at once.
  typecheck:
    name: Typecheck condo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - run: yarn workspace @app/condo build:deps
      - run: yarn tsc --noEmit -p apps/condo/tsconfig.json

  build-and-push:
    name: Build and push condo image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.condo
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soh-system-condo:latest
            ghcr.io/${{ github.repository_owner }}/soh-system-condo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
